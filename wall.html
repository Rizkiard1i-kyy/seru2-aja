
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f6f0e7"
    >

    <meta
        name="description"
        content="BISING! CLUB — album foto, photobooth, arcade, dan papan absurd satu geng."
    >

    <title>Wall | Study Group's</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="aset/css/style.css"
    >

    <!-- JAVASCRIPT -->
    <script src="aset/js/data.js" defer></script>
    <script src="aset/js/app.js" defer></script>
</head>

<body data-page="wall">

    <!-- =====================================
         BACKGROUND NOISE
    ===================================== -->

    <div
        class="noise"
        aria-hidden="true"
    ></div>

    <!-- =====================================
         HEADER / NAVBAR
    ===================================== -->

    <header class="topbar">

        <!-- LOGO -->

        <a
            class="logo"
            href="index.html"
            aria-label="Bising Club, beranda"
        >
            <span class="logo-burst">+</span>

            Study Group's<span class="logo-punct">!</span>

            <small>eaaaaaa</small>
        </a>

        <!-- DESKTOP NAVIGATION -->

        <nav
            class="topnav"
            aria-label="Menu utama"
        >

            <a
                href="index.html"
                class="navlink"
                aria-current="false"
            >
                <span class="nav-icon">⌂</span>
                <span>START</span>
            </a>

            <a
                href="album.html"
                class="navlink"
                aria-current="false"
            >
                <span class="nav-icon">▦</span>
                <span>ALBUM</span>
            </a>

            <a
                href="booth.html"
                class="navlink"
                aria-current="false"
            >
                <span class="nav-icon">▣</span>
                <span>BOOTH</span>
            </a>

            <a
                href="arcade.html"
                class="navlink"
                aria-current="false"
            >
                <span class="nav-icon">✳</span>
                <span>ARCADE</span>
            </a>

            <a
                href="wall.html"
                class="navlink active"
                aria-current="page"
            >
                <span class="nav-icon">✎</span>
                <span>WALL</span>
            </a>

        </nav>

        <!-- LIVE STATUS -->

        <div class="live-tag">
            <span class="live-dot"></span>
            STILL LOUD
        </div>

    </header>

    <!-- =====================================
         MAIN CONTENT
    ===================================== -->

    <main id="main">

        <section class="wall-shell">

            <!-- =================================
                 WALL HEADER
            ================================= -->

            <div class="wall-head">

                <!-- PAGE TITLE -->

                <div>

                    <div class="eyebrow">
                        FREE BOARD / DRAG ANYTHING
                    </div>

                    <h1>
                        TEMPEL<span>IN.</span>
                    </h1>

                </div>

                <!-- WALL ACTION BUTTONS -->

                <div class="wall-buttons">

                    <!-- SHUFFLE BOARD -->

                    <button
                        type="button"
                        id="wallScatter"
                    >
                        ↻ ACAK
                    </button>

                    <!-- RESET BOARD -->

                    <button
                        type="button"
                        id="wallReset"
                    >
                        ↶ RESET
                    </button>

                </div>

            </div>

            <!-- =================================
                 WALL LAYOUT
            ================================= -->

            <div class="wall-flex">

                <!-- =============================
                     INTERACTIVE WALL BOARD
                ============================= -->

                <div
                    class="wall-board"
                    id="wallBoard"
                    aria-label="Papan foto dan sticky notes yang bisa diseret"
                >

                    <!-- BOARD BACKGROUND PATTERN -->

                    <div class="board-pattern"></div>

                    <!-- BOARD STAMP -->

                    <div class="board-stamp">
                        KUMPUL, FOTO,
                        <br>
                        ULANG LAGI.
                    </div>

                    <!-- BOARD DECORATION -->

                    <div class="board-deco">
                        ✳
                    </div>

                    <!-- =========================
                         DRAGGABLE BOARD ITEMS
                    ========================= -->

                    <!--
                        Foto dan sticky notes akan
                        dimunculkan otomatis oleh
                        fungsi drawBoard() di app.js.

                        Pengguna bisa menggeser
                        posisi foto dan catatan.
                    -->

                    <div
                        class="board-objects"
                        id="boardObjects"
                    ></div>

                </div>

                <!-- =============================
                     WALL SIDEBAR
                ============================= -->

                <aside class="wall-side">

                    <!-- DECORATIVE ICON -->

                    <div class="wall-side-mark">
                        ✐
                    </div>

                    <!-- SIDEBAR TITLE -->

                    <h2>
                        LEMPAR
                        <br>
                        CATATAN
                    </h2>

                    <!-- =========================
                         ADD STICKY NOTE FORM
                    ========================= -->

                    <form id="wallForm">

                        <!-- NOTE LABEL -->

                        <label for="wallNote">
                            ISI BEBAS (ASAL SOPAN)
                        </label>

                        <!-- NOTE TEXTAREA -->

                        <textarea
                            id="wallNote"
                            maxlength="100"
                            placeholder="siapa yang ngajak tapi telat?"
                            required
                            rows="3"
                        ></textarea>

                        <!-- ADD NOTE BUTTON -->

                        <button type="submit">
                            + TEMPEL NOTE
                        </button>

                    </form>

                    <!-- =========================
                         SIDEBAR INFORMATION
                    ========================= -->

                    <span class="wall-side-bottom">
                        geser foto & note ↗
                        <br>
                        tersimpan di browser ini
                    </span>

                    <!-- DECORATIVE STICKER -->

                    <div class="wall-sticker">
                        NO
                        <br>
                        CONTEXT
                        <br>
                        ALLOWED ✷
                    </div>

                </aside>

            </div>

        </section>

    </main>

    <!-- =====================================
         MOBILE NAVIGATION
    ===================================== -->

    <nav
        class="mobile-nav"
        aria-label="Menu bawah"
    >

        <!-- START -->

        <a
            href="index.html"
            class="navlink"
            aria-current="false"
        >
            <span class="nav-icon">⌂</span>
            <span>START</span>
        </a>

        <!-- ALBUM -->

        <a
            href="album.html"
            class="navlink"
            aria-current="false"
        >
            <span class="nav-icon">▦</span>
            <span>ALBUM</span>
        </a>

        <!-- PHOTOBOOTH -->

        <a
            href="booth.html"
            class="navlink"
            aria-current="false"
        >
            <span class="nav-icon">▣</span>
            <span>BOOTH</span>
        </a>

        <!-- ARCADE -->

        <a
            href="arcade.html"
            class="navlink"
            aria-current="false"
        >
            <span class="nav-icon">✳</span>
            <span>ARCADE</span>
        </a>

        <!-- WALL -->

        <a
            href="wall.html"
            class="navlink active"
            aria-current="page"
        >
            <span class="nav-icon">✎</span>
            <span>WALL</span>
        </a>

    </nav>

    <!-- =====================================
         TOAST NOTIFICATION
    ===================================== -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>

    <!-- =====================================
         PHOTO VIEWER / MODAL
    ===================================== -->

    <div
        id="photoViewer"
        class="viewer"
        aria-hidden="true"
    >

        <!-- DARK BACKDROP -->

        <div
            class="viewer-backdrop"
            data-close="viewer"
        ></div>

        <!-- VIEWER CONTAINER -->

        <div
            class="viewer-shell"
            role="dialog"
            aria-modal="true"
            aria-label="Lihat foto"
        >

            <!-- VIEWER HEADER -->

            <div class="viewer-top">

                <span id="viewerTag">
                    FILE 01/17
                </span>

                <!-- VIEWER ACTIONS -->

                <div class="viewer-actions">

                    <!-- FAVORITE -->

                    <button
                        type="button"
                        id="viewerHeart"
                        aria-label="Tandai foto favorit"
                    >
                        ♡
                    </button>

                    <!-- DOWNLOAD -->

                    <a
                        id="viewerDownload"
                        href="#"
                        download
                        aria-label="Unduh foto"
                    >
                        ↓
                    </a>

                    <!-- CLOSE -->

                    <button
                        type="button"
                        data-close="viewer"
                        aria-label="Tutup foto"
                    >
                        ✕
                    </button>

                </div>

            </div>

            <!-- =================================
                 VIEWER PHOTO
            ================================= -->

            <div class="viewer-photo">

                <!-- PREVIOUS PHOTO -->

                <button
                    type="button"
                    class="viewer-arrow prev"
                    id="viewerPrev"
                    aria-label="Foto sebelumnya"
                >
                    ‹
                </button>

                <!-- MAIN PHOTO -->

                <img
                    id="viewerImage"
                    alt="Foto geng"
                >

                <!-- NEXT PHOTO -->

                <button
                    type="button"
                    class="viewer-arrow next"
                    id="viewerNext"
                    aria-label="Foto berikutnya"
                >
                    ›
                </button>

            </div>

            <!-- VIEWER FOOTER -->

            <div class="viewer-bottom">

                <span id="viewerLabel"></span>

                <span>
                    ← → untuk geser
                </span>

            </div>

        </div>

    </div>

    <!-- =====================================
         CONFETTI ANIMATION
    ===================================== -->

    <div
        class="confetti-layer"
        id="confettiLayer"
        aria-hidden="true"
    ></div>

</body>

</html>
